name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p bin
          VERSION=$(git describe --tags --long --always)
          for os in darwin linux windows; do
            suffix=""
            if [ "$os" == "windows" ]; then
              suffix=".exe"
            fi
            echo "Building for $os..."
            GOOS=$os GOARCH=amd64 go build -mod=mod -ldflags "-s -w -X main.version=$VERSION" -o bin/guber-$VERSION-$os$suffix
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
